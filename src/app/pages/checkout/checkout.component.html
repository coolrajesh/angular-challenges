<div class="min-h-screen bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto">
        <h2 class="text-3xl font-bold text-center mb-8 text-blue-800">Checkout</h2>

        <div class="grid md:grid-cols-3 gap-6">
            <!-- 🛒 Cart Summary -->
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Your Cart</h3>
                <div *ngIf="cartItems.length > 0; else emptyCart">
                    <div *ngFor="let item of cartItems; let i = index"
                        class="flex justify-between items-center py-4 border-b">
                        <div class="flex items-center gap-4">
                            <!-- <img [src]="item.image" alt="{{ item.title }}" class="w-16 h-16 object-cover rounded-lg" /> -->
                            <div>
                                <h4 class="font-semibold">{{ item.title }}</h4>
                                <p class="text-sm text-gray-500">₹{{ item.price }}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button (click)="decreaseQuantity(i)" class="px-2 py-1 bg-gray-300 rounded">-</button>
                            <span class="px-3">{{ item.quantity }}</span>
                            <button (click)="increaseQuantity(i)" class="px-2 py-1 bg-gray-300 rounded">+</button>
                        </div>
                        <div class="text-right">
                            <p class="font-semibold text-green-600">₹{{ item.price * item.quantity }}</p>
                            <button (click)="removeItem(i)" class="text-red-500 text-sm hover:underline">Remove</button>
                        </div>
                    </div>
                </div>

                <ng-template #emptyCart>
                    <p class="text-gray-500 text-center py-8">Your cart is empty.</p>
                </ng-template>
            </div>

            <!-- 🧾 Order Summary -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Billing Information</h3>

                <!-- Billing Form -->
                <form (ngSubmit)="placeOrder()" #checkoutForm="ngForm">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Full Name</label>
                        <input type="text" class="w-full border px-3 py-2 rounded-md" required
                             name="name" />
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" class="w-full border px-3 py-2 rounded-md" required
                            name="email" />
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Address</label>
                        <textarea class="w-full border px-3 py-2 rounded-md" required 
                            name="address"></textarea>
                    </div>

                    <!-- Summary -->
                    <div class="my-6 border-t pt-4">
                        <div class="flex justify-between mb-2">
                            <span>Subtotal</span>
                            <span>₹{{ subtotal }}</span>
                        </div>
                        <div class="flex justify-between mb-2">
                            <span>Tax (5%)</span>
                            <span>₹{{ tax }}</span>
                        </div>
                        <div class="flex justify-between font-bold text-lg border-t pt-2">
                            <span>Total</span>
                            <span>₹{{ total }}</span>
                        </div>
                    </div>

                    <!-- Payment Placeholder -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Payment Method</label>
                        <select class="w-full border px-3 py-2 rounded-md" 
                            name="paymentMethod" required>
                            <option value="">Select Method</option>
                            <option value="cod">Cash on Delivery</option>
                            <option value="upi">UPI</option>
                            <option value="card">Credit/Debit Card</option>
                        </select>
                    </div>

                    <button type="submit"
                        class="w-full bg-green-600 text-white py-2 rounded-md font-semibold hover:bg-green-700 transition">
                        Place Order
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
