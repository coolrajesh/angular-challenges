<div class="max-w-5xl mx-auto p-6 bg-white shadow-md rounded-lg mt-6">
    <div class="fixed top-4 right-4 z-50">
        <a routerLink="/checkout" class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-gray-700 hover:text-black" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.293 2.293a1 1 0 00.293 1.414L7 17m0 0h10m-10 0a1 1 0 001 1h8a1 1 0 001-1m-9-4v-2a1 1 0 011-1h2a1 1 0 011 1v2">
                </path>
            </svg>
            <span class="absolute -top-1 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">
                {{ cartCount }}
            </span>
        </a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- product-details.component.html -->
        <div class="product-gallery">
            <!-- Thumbnails slider -->
            <div class="thumbnails" >
                <img *ngFor="let img of images;let i=index" [src]="img" (click)="selectedImage = img"
                    [class.active]="img === selectedImage"  />
            </div>
        
            <!-- Main image with zoom on hover -->
            <div class="image-container" (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave()">
                <img [src]="selectedImage" class="main-image" [ngStyle]="zoomStyle" />
            </div>
        </div>
       

        <!-- Product Details -->
        <div class="flex flex-col justify-between">

            <div>
                <h1 class="text-3xl font-bold mb-2">{{ product.title }}</h1>
                <p class="text-gray-600 mb-4">{{ product.description }}</p>

                <div class="mb-4">
                    <span class="text-2xl font-semibold text-green-600">INR {{ product.price }}</span>
                </div>             

                <div class="mb-6">
                    <span class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full">
                        Category: {{ product.category.name }}
                    </span>
                </div>
            </div>

            <!-- Action Button -->
            <div class="mt-4" >
                <button (click)="addToCart(product)" style="cursor: pointer;"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg text-lg transition-all duration-300">
                    Add to Cart
                </button>
            </div>

        </div>

    </div>
</div>
