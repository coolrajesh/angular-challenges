<div class="min-h-screen bg-gray-50 flex">

    <!-- 🌟 Sidebar (Left) -->
    <aside class="w-full md:w-1/4 bg-white p-6 border-r border-gray-200 sticky top-0 h-screen overflow-auto">
        <h2 class="text-2xl font-bold mb-8 text-blue-700">Filters</h2>

        <!-- Category Filter -->
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">Category:</label>
           <ng-select [(ngModel)]="selectedCategories" [items]="categoriesList" bindLabel="name" bindValue="id" multiple="true"
                placeholder="Select categories"  [closeOnSelect]="false" [multiple]="false"
                [hideSelected]="true" [addTag]="false" [clearable]="true" (change)="onChange($event)" >               
            </ng-select>
        </div>

        <!-- Price Filter -->
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">Max Price:</label>
            <ngx-slider  [(value)]="minValue" [(highValue)]="maxValue" [options]="options" (userChange)="onUserChange($event)"></ngx-slider>
            <label class="block text-gray-700 font-semibold mt-2">Selected Price Range: ${{ minValue }} - ${{ maxValue }}</label>          
        </div>      
    </aside>

    <!-- 🌟 Main Content -->
    <div class="flex-1 p-6 relative">
        <!-- Floating Cart Icon -->
        <div class="fixed top-4 right-4 z-50">
            <a routerLink="/checkout" class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-gray-700 hover:text-black" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.293 2.293a1 1 0 00.293 1.414L7 17m0 0h10m-10 0a1 1 0 001 1h8a1 1 0 001-1m-9-4v-2a1 1 0 011-1h2a1 1 0 011 1v2">
                    </path>
                </svg>
                <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">
                    {{ cartCount }}
                </span>
            </a>
        </div>

        <!-- Title -->
        <h1 class="text-4xl font-bold text-center mb-10 text-blue-700">🛒 Shopping Cart Example in Angular</h1>
        <label *ngIf="errorMessage">Something went wrong</label>
        <!-- Products Grid -->
        <ng-container *ngIf="products && products.length > 0; ">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                <div *ngFor="let product of products"
                    class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition transform hover:scale-105">

                    <div (click)="goToProductDetails(product)" class="overflow-hidden cursor-pointer">
                        <img [src]="product.images[0]" alt="{{ product.title }}"
                            class="w-full h-52 object-cover transition-transform duration-300 hover:scale-110" />
                    </div>

                    <div class="p-5 flex flex-col h-56">
                        <div class="flex-1">
                            <h3 class="text-lg font-bold text-gray-800 mb-2">{{ product.title }}</h3>
                            <p class="text-gray-500 text-sm line-clamp-2">{{ product.description }}</p>
                        </div>

                        <div class="flex justify-between items-center mt-4">
                            <span class="text-green-600 font-bold text-xl">₹{{ product.price }}</span>
                            <button (click)="addToCart(product)" style="cursor: pointer;"
                                class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold py-2 px-4 rounded-full">
                                ➕ Add
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- No more data -->
            <div *ngIf="!hasMoreData" class="flex flex-col items-center justify-center mt-10 text-gray-500">
                <svg class="w-16 h-16 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m-6-8h6m-8 12h10a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p class="text-lg font-semibold">No more products!</p>
                <p class="text-sm">Please check back later for updates.</p>
            </div>
        </ng-container>
    </div>
</div>
